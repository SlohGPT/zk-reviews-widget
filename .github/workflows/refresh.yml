name: Refresh reviews

on:
  schedule:
    - cron: '0 4 * * 1'   # každý pondelok 04:00 UTC — scrape Google+Booking, publish fresh data
  workflow_dispatch:        # + manuálne tlačidlo "Run workflow"

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scrape + rebuild widget data
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python refresh.py
          python build_remote.py

      - name: Commit & push if changed
        run: |
          git config user.name "zk-reviews-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "chore: refresh reviews $(date -u +%Y-%m-%d)"; git push; }
